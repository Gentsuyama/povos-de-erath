<style>
  :root{--fg:#e8f4ff;--muted:#9fb6c9;--accent:#6fb8ff;--gold:#e8c06a;--panel:rgba(8,16,28,.62)}
  html,body{margin:0;height:100%;background:#050a12;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg)}
  canvas{display:block}
  .title{position:fixed;left:24px;top:20px;pointer-events:none}
  .title h1{margin:0;font:700 28px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.06em;color:#f3e3bf;text-shadow:0 0 18px rgba(232,192,106,.45)}
  .title p{margin:6px 0 0;font-size:13px;color:var(--muted)}
  .bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:14px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(120,170,230,.18);flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px)}
  .bar button{appearance:none;border:1px solid rgba(120,170,230,.25);background:rgba(20,36,58,.7);color:var(--fg);font:600 14px system-ui,sans-serif;padding:10px 16px;border-radius:10px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
  .bar button:hover{background:rgba(40,70,110,.8)}
  .bar button:active{transform:scale(.97)}
  .bar button.on{background:linear-gradient(180deg,#2d5fa0,#1d3f70);border-color:var(--accent);box-shadow:0 0 14px rgba(111,184,255,.35)}
  .bar kbd{font:500 11px system-ui;color:var(--muted);margin-left:6px}
  .hint{position:fixed;right:20px;top:22px;font-size:12px;color:var(--muted);text-align:right;pointer-events:none}
  #load{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
  .kit{position:fixed;left:16px;top:96px;width:236px;max-height:calc(100vh - 250px);overflow:auto;padding:12px;border-radius:14px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid rgba(120,170,230,.18);font-size:13px}
  .kit h2{margin:4px 0 8px;font:700 12px system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .kit .presets{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  .kit button{appearance:none;border:1px solid rgba(120,170,230,.25);background:rgba(20,36,58,.7);color:var(--fg);font:600 12px system-ui;padding:7px 6px;border-radius:8px;cursor:pointer}
  .kit button:hover{background:rgba(40,70,110,.8)}
  .kit button.on{background:linear-gradient(180deg,#2d5fa0,#1d3f70);border-color:var(--accent)}
  .kit label.slot{display:grid;grid-template-columns:86px 1fr;align-items:center;gap:6px;margin:5px 0;color:var(--muted)}
  .kit select{background:rgba(10,20,34,.9);color:var(--fg);border:1px solid rgba(120,170,230,.25);border-radius:7px;padding:5px;font:13px system-ui}
  .kit .row{display:flex;gap:6px;margin-top:10px;align-items:center;color:var(--muted)}
  .kit .row button{flex:1}
  .kit .modo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
  body.todos #kitBody{display:none}
  body:not(.todos) #gRow{display:none}
  .tag{pointer-events:auto;cursor:pointer;text-align:center;padding:4px 10px;border-radius:9px;background:rgba(8,16,28,.55);border:1px solid rgba(232,192,106,.35);backdrop-filter:blur(4px);white-space:nowrap;transition:background .15s}
  .tag:hover{background:rgba(40,70,110,.8)}
  .tag b{display:block;font:700 14px Georgia,serif;color:#f3e3bf;letter-spacing:.04em}
  .tag span{display:block;font-size:10.5px;color:var(--muted)}
  #labels{position:fixed;inset:0;pointer-events:none}
  .credito{position:fixed;right:12px;bottom:6px;font-size:10.5px;color:var(--muted);opacity:.8}.credito a{color:inherit}
  .credito:empty{display:none}
  .nav{position:fixed;right:16px;bottom:96px;display:flex;flex-direction:column;gap:6px}
  .nav button{appearance:none;min-width:44px;height:40px;border:1px solid rgba(120,170,230,.25);background:var(--panel);backdrop-filter:blur(8px);color:var(--fg);font:600 16px system-ui;border-radius:10px;cursor:pointer;padding:0 10px}
  .nav button:hover{background:rgba(40,70,110,.8)}
  .nav button.on{background:linear-gradient(180deg,#2d5fa0,#1d3f70);border-color:var(--accent)}
  .nav #nMode{font-size:12px}
  @media (max-width:640px){body.todos .kit{top:62px;bottom:auto;max-height:none}.tag{padding:2px 6px}.tag b{font-size:11px}.tag span{display:none}
  .kit{top:auto;bottom:118px;left:8px;right:8px;width:auto;max-height:30vh}.title h1{font-size:20px}.hint{display:none}
  .bar{left:8px;right:8px;transform:none;bottom:10px;gap:6px;padding:6px}.bar button{padding:8px 10px;font-size:13px}
  .nav{right:8px;bottom:auto;top:28%}.credito{bottom:auto;top:6px;right:8px;font-size:9px}}
</style>

function play(name){

  const next = actions[name];
  next.reset().setEffectiveWeight(1).fadeIn(0.35).play();
  if(current && current !== next) current.fadeOut(0.35);
  current = next; mode = name;

const parts = {};                 // slot -> raca -> [meshes]

const weapons = {dir: {}, esq: {}}, wpick = {dir: '', esq: ''};

// a geometria comprimida guarda a quantização na transformação do nó: a arma vai para o soquete com o MESMO
// deslocamento que tinha em relação ao soquete canônico "pegada_<lado>" (identidade num GLB sem compressão)
function restOffset(root, w, side){
  root.updateMatrixWorld(true);
  const s = root.getObjectByName('pegada_' + side);
  w.userData.off = s ? s.matrixWorld.clone().invert().multiply(w.matrixWorld) : new THREE.Matrix4();
}
function seat(w){ (w.userData.off || new THREE.Matrix4()).decompose(w.position, w.quaternion, w.scale); }
function placeWeapons(){
  for(const side of ['dir', 'esq']) for(const [n, w] of Object.entries(weapons[side])){
    w.visible = (n === wpick[side]);
    if(!w.visible) continue;
    const sock = hero.getObjectByName(`${pick['mao_' + side]}__pegada_${side}`) || hero.getObjectByName('pegada_' + side);
    if(sock && w.parent !== sock){ sock.add(w); }
    seat(w);
  }
}
function equip(slot, raca){
  pick[slot] = raca;
  for(const [r, ms] of Object.entries(parts[slot] || {})) for(const m of ms) m.visible = (r === raca);
}
function refresh(){
  const base = RACAS[pick.tronco] || {};
  if(heroRoot) heroRoot.scale.setScalar(base.escala || 1);           // tamanho segue a raça do tronco
  const uniq = new Set(Object.values(pick));
  const subEl = document.getElementById('sub'); subEl.dataset.prov = uniq.size === 1 ? `${base.nome} · ${base.titulo}` : 'Mistura · ' + [...uniq].map(r => RACAS[r]?.nome).join(' + ');
  document.querySelectorAll('#slots select').forEach(sel => { sel.value = pick[sel.dataset.slots.split(',')[0]]; });
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', uniq.size === 1 && pick.tronco === b.dataset.r));
  if(view !== 'todos') subEl.textContent = subEl.dataset.prov;
  placeWeapons();
  document.querySelectorAll('#armas select').forEach(sel => { sel.value = wpick[sel.dataset.side]; });
  if(view !== 'todos') history.replaceState(null, '', '#' + Object.entries(pick).map(([s, r]) => s + '=' + r).join('&')
    + '&arma_dir=' + wpick.dir + '&arma_esq=' + wpick.esq);
}
function preset(r){ for(const s in SLOT_NAMES) equip(s, r); refresh(); }
function buildKit(){
  const pre = document.getElementById('presets');
  for(const r of racaIds){ const b = document.createElement('button'); b.textContent = RACAS[r].nome; b.dataset.r = r; b.onclick = () => preset(r); pre.appendChild(b); }
  const draw = () => {
    const box = document.getElementById('slots'); box.innerHTML = '';
    const groups = document.getElementById('sides').checked ? Object.fromEntries(Object.keys(SLOT_NAMES).map(s => [s, [s]])) : PAIRS;
    for(const [g, slots] of Object.entries(groups)){
      const lab = document.createElement('label'); lab.className = 'slot';
      lab.innerHTML = `<span>${PAIR_NAMES[g] || SLOT_NAMES[g]}</span>`;
      const sel = document.createElement('select'); sel.dataset.slots = slots.join(',');
      for(const r of racaIds) if(slots.some(s => parts[s]?.[r])) sel.add(new Option(RACAS[r].nome, r));
      sel.onchange = () => { for(const s of slots) equip(s, sel.value); refresh(); };
      lab.appendChild(sel); box.appendChild(lab);
    }
    refresh();
  };
  document.getElementById('sides').onchange = draw;
  document.getElementById('rand').onclick = () => { for(const slots of Object.values(PAIRS)){ const r = racaIds[Math.floor(Math.random()*racaIds.length)]; for(const s of slots) equip(s, r); } refresh(); };
  // estado inicial pela URL (#cabeca=vran&tronco=litomante...), senão a última raça da lista
  const fromHash = Object.fromEntries(location.hash.slice(1).split('&').map(kv => kv.split('=')).filter(([s, r]) => SLOT_NAMES[s] && RACAS[r]));
  for(const s in SLOT_NAMES) equip(s, fromHash[s] || racaIds[racaIds.length - 1]);
  const hv = Object.fromEntries(location.hash.slice(1).split('&').map(kv => kv.split('=')));
  const ab = document.getElementById('armas');
  if(!Object.keys(weapons.dir).length && !Object.keys(weapons.esq).length) document.getElementById('armasBox').remove();
  for(const [side, lab] of [['dir', 'Mão direita'], ['esq', 'Mão esquerda']]){
    const l = document.createElement('label'); l.className = 'slot'; l.innerHTML = `<span>${lab}</span>`;
    const sel = document.createElement('select'); sel.dataset.side = side; sel.add(new Option('Nenhuma', ''));
    for(const n of Object.keys(weapons[side])) sel.add(new Option(WNAMES[n] || n, n));
    wpick[side] = hv['arma_' + side] !== undefined ? hv['arma_' + side] : (side === 'dir' ? 'espada' : 'escudo');
    if(!weapons[side][wpick[side]]) wpick[side] = '';
    sel.onchange = () => { wpick[side] = sel.value; refresh(); };
    l.appendChild(sel); ab && ab.appendChild(l);
  }
  draw();
}

// ---------- modo "Todos": um clone completo de cada raça, lado a lado ----------
const gArmas = [];
document.getElementById('gArmas').onchange = e => { for(const o of gArmas) o.visible = e.target.checked; };
function buildGallery(src, clips){
  galleryRoot = new THREE.Group(); scene.add(galleryRoot);
  const n = racaIds.length, gap = Math.min(1.12, 6.7 / Math.max(1, n - 1));
  racaIds.forEach((r, i) => {
    const c = skClone(src), k = i - (n - 1) / 2;
    c.traverse(o => {
      if(o.isMesh && o.name.includes('__') && !o.name.startsWith('arma__')) o.visible = o.name.split('__')[0] === r;
      if(o.isMesh){ o.frustumCulled = false; o.castShadow = true; o.receiveShadow = true; }
    });
    const armas = [];
    c.traverse(o => { const m = /^arma__(\w+)_(dir|esq)$/.exec(o.name); if(m) armas.push([o, m[1], m[2]]); });
    for(const [o, w, side] of armas){
      const on = (w === 'espada' && side === 'dir') || (w === 'escudo' && side === 'esq'); o.visible = false;
      if(on) gArmas.push(o);
      const sock = c.getObjectByName(`${r}__pegada_${side}`);
      if(on && sock){ restOffset(c, o, side); sock.add(o); seat(o); }
    }
    const holder = new THREE.Group(); holder.add(c); holder.scale.setScalar(RACAS[r].escala || 1);
    const tag = document.createElement('div'); tag.className = 'tag';
    tag.innerHTML = `<b>${RACAS[r].nome}</b><span>${RACAS[r].titulo || ''}</span>`;
    tag.title = 'Abrir no provador'; tag.onclick = () => { setView('provador'); preset(r); };
    const lab = new CSS2DObject(tag); lab.position.set(0, 2.15 / (RACAS[r].escala || 1), 0); holder.add(lab);
    galleryRoot.add(holder);
    const mixer = new THREE.AnimationMixer(c), actions = {};
    for(const clip of clips) actions[clip.name] = mixer.clipAction(clip);
    gallery.push({mixer, actions, current: null, holder});
  });
}
function layoutGallery(portrait){            // deitado: uma fileira em arco; em pé (celular): 4 atrás + 3 na frente
  const n = gallery.length, back = Math.ceil(n / 2), gap = Math.min(1.12, 6.7 / Math.max(1, n - 1));
  gallery.forEach((g, i) => {
    if(!portrait){ const k = i - (n - 1) / 2; g.holder.position.set(k * gap, 0, 0.5 - 0.1 * k * k); g.holder.rotation.y = -k * 0.08; }
    else { const rows = [Math.ceil(n / 3), Math.ceil((n - Math.ceil(n / 3)) / 2)]; rows.push(n - rows[0] - rows[1]);
      let row = 0, j = i; while(j >= rows[row]){ j -= rows[row]; row++; }
      const k = j - (rows[row] - 1) / 2;
      g.holder.position.set(k * 1.25, 0, -2.1 + 2.1 * row); g.holder.rotation.y = -k * 0.06; }
  });
}
function frameGallery(){
  const portrait = camera.aspect < 0.9; layoutGallery(portrait);
  camera.fov = portrait ? 50 : 38; camera.updateProjectionMatrix();
  if(portrait){
    const th = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect;
    const d = Math.max(6.6, 3.9 / (2 * th));
    controls.maxDistance = Math.max(12, d + 3); scene.fog.density = 0.055 * Math.min(1, 7 / d);
    controls.target.set(0, 0.5, 0.3); camera.position.set(0, 4.6, d + 0.8); return;
  }
  scene.fog.density = 0.055;
  const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
  const th = Math.tan(hfov / 2), frac = innerWidth > 640 ? 300 / innerWidth : 0;   // o painel ocupa ~300 px à esquerda
  const d = Math.min(16, Math.max(6.6, 7.6 / (2 * th * (1 - frac))));               // os 7 cabem na área livre
  const sx = -frac * d * th;                                                           // e ficam centrados nela
  controls.maxDistance = Math.max(12, d + 2);
  controls.target.set(sx, 0.95, 0); camera.position.set(sx, 1.7, d);
}
function setView(v){
  view = v; document.body.classList.toggle('todos', v === 'todos');
  if(galleryRoot) galleryRoot.visible = v === 'todos';
  if(heroRoot) heroRoot.visible = v !== 'todos';
  labelRenderer.domElement.style.display = v === 'todos' ? '' : 'none';
  document.getElementById('mTodos').classList.toggle('on', v === 'todos');
  document.getElementById('mProv').classList.toggle('on', v !== 'todos');
  const sub = document.getElementById('sub');
  if(v === 'todos'){ sub.textContent = 'As 7 raças · clique num nome para abrir no provador'; frameGallery(); history.replaceState(null, '', '#todos'); }
  else { homeProv(); refresh(); }
}
function homeProv(){
  scene.fog.density = 0.055; camera.fov = 38; camera.updateProjectionMatrix(); controls.maxDistance = 12;
  const far = camera.aspect < 0.9 ? 1.6 : 1;                      // em pé: um pouco mais longe para caber
  camera.position.set(2.6 * far, 1.9, 5.2 * far); controls.target.set(0, 1, 0);
  if(heroRoot){ followPt.set(heroRoot.position.x * 0.6, 0, heroRoot.position.z * 0.6); lastFollow.copy(followPt); }
}
// ---------- navegação: zoom, arrastar, vista inicial ----------
function zoom(f){
  const off = camera.position.clone().sub(controls.target);
  const L = THREE.MathUtils.clamp(off.length() * f, controls.minDistance, controls.maxDistance);
  camera.position.copy(controls.target).addScaledVector(off.normalize(), L);
}
let panMode = false;
function setPan(on){
  panMode = on;
  controls.mouseButtons.LEFT = on ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE;
  controls.mouseButtons.RIGHT = on ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;
  controls.touches.ONE = on ? THREE.TOUCH.PAN : THREE.TOUCH.ROTATE;
  const b = document.getElementById('nMode'); b.textContent = on ? '✥ Mover' : '⟳ Girar'; b.classList.toggle('on', on);
}
document.getElementById('zIn').onclick = () => zoom(0.75);
document.getElementById('zOut').onclick = () => zoom(1.33);
document.getElementById('nMode').onclick = () => setPan(!panMode);
document.getElementById('nHome').onclick = () => { if(view === 'todos') frameGallery(); else homeProv(); };
addEventListener('keydown', e => { if(e.key === '+' || e.key === '=') zoom(0.8); if(e.key === '-') zoom(1.25); });
document.getElementById('mTodos').onclick = () => setView('todos');
document.getElementById('mProv').onclick = () => setView('provador');

// decodificação nativa do base64 (rápida; evita 1 chamada JS por byte)
const glbBuffer = await (await fetch('data:model/gltf-binary;base64,' + GLB_B64)).arrayBuffer();
new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).parse(glbBuffer, '', gltf => {
  heroRoot = new THREE.Group(); scene.add(heroRoot);
  hero = gltf.scene; heroRoot.add(hero);
  hero.traverse(o => {
    const wm = /^arma__(\w+)_(dir|esq)$/.exec(o.name);
    if(wm){ weapons[wm[2]][wm[1]] = o; restOffset(hero, o, wm[2]); }
    else if(o.isMesh && o.name.includes('__') && !o.name.startsWith('arma__')){ const [r, s0] = o.name.split('__'); const s = SLOT_NAMES[s0] ? s0 : s0.replace(/_\d+$/, '');   // peça com 2 materiais vira <nome> e <nome>_1
      parts[s] = parts[s] || {}; (parts[s][r] = parts[s][r] || []).push(o); }
    if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      for(const m of [].concat(o.material)){ m.envMap=envTex; m.envMapIntensity=0.7;
        if(!m.metalnessMap && !m.roughnessMap && m.metalness===1 && m.roughness===1){ m.roughness=0.6; m.metalness=0.15; }
        m.needsUpdate=true; } }
  });
  buildGallery(hero, gltf.animations);   // antes do provador reposicionar as armas do herói
  mixer = new THREE.AnimationMixer(hero);
  for(const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
  ORDER = gltf.animations.map(c => c.name);
  ORDER.forEach((n,i) => {
    const b=document.createElement('button'); b.innerHTML=`${n}<kbd>${i+1}</kbd>`; b.onclick=()=>play(n); bar.appendChild(b); buttons[n]=b;
  });
  buildKit();
  document.getElementById('load').remove();
  const h0 = location.hash.slice(1);
  setView(!h0 || h0 === 'todos' ? 'todos' : 'provador');
  play('Parado');
}, err => { document.getElementById('load').textContent = 'Erro ao carregar o modelo: ' + err; });

addEventListener('keydown', e => { const i = parseInt(e.key,10); if(i>=1 && i<=ORDER.length) play(ORDER[i-1]); });
addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); if(view === 'todos') frameGallery(); });

// ---------- loop ----------
const clock = new THREE.Clock(); let yaw = 0;
const followPt = new THREE.Vector3(), lastFollow = new THREE.Vector3();
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if(mixer && view !== 'todos') mixer.update(dt);
  if(view === 'todos') for(const g of gallery) g.mixer.update(dt);
  if(heroRoot && view !== 'todos'){
    const v = SPEED[mode] || 0;
    if(v){ angle += v/RADIUS*dt; }
    // na volta: posição no círculo e olhando na tangente; parado: no lugar, virando para a câmera
    const r = v ? RADIUS : heroRoot.position.length();
    const target = new THREE.Vector3(Math.cos(angle)*RADIUS, 0, Math.sin(angle)*RADIUS);
    if(v){ heroRoot.position.lerp(target, Math.min(1, dt*4)); }
    let wantYaw;
    if(v){ wantYaw = Math.atan2(-Math.sin(angle), Math.cos(angle)); }            // tangente (sentido anti-horário visto de cima)
    else { wantYaw = yaw; }                                   // parado: fica como está (girar a vista mostra as costas)
    let d = wantYaw - yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); yaw += d*Math.min(1, dt*(v?8:3));
    heroRoot.rotation.y = yaw;
    // câmera acompanha de leve
    followPt.lerp(new THREE.Vector3(heroRoot.position.x*0.6, 0, heroRoot.position.z*0.6), Math.min(1, dt*2));
    const dl = followPt.clone().sub(lastFollow); lastFollow.copy(followPt);
    controls.target.add(dl); camera.position.add(dl);
  }
  runes.material.opacity = 0.42 + 0.15*Math.sin(t*1.6);
  runes.rotation.z = t*0.05;
  const p = pgeo.attributes.position.array;
  for(let i=0;i<N;i++){ p[i*3+1] += dt*(0.12+0.1*Math.sin(seed[i])); p[i*3] += Math.sin(t*0.5+seed[i])*dt*0.05; if(p[i*3+1]>6) p[i*3+1]=0; }
  pgeo.attributes.position.needsUpdate = true;
  rim1.intensity = 16 + 3*Math.sin(t*1.3);
  if(controls.target.length() > 7){ const ex = controls.target.clone().setLength(controls.target.length() - 7); controls.target.sub(ex); camera.position.sub(ex); }
  controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0, 3);
  controls.update(); renderer.render(scene, camera); if(view === 'todos') labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
