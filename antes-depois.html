<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antes e Depois</title>
<style>
  :root { --card: rgba(24,20,17,.84); --tx: #f3ead8; --acc: #e0aa35; --line: rgba(255,255,255,.14); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fbfd4; color: var(--tx); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; z-index: 2; }
  #ui h1 { font-size: 16px; margin: 0 8px 0 0; }
  button { background: #3a2f26; color: var(--tx); border: 1px solid #5d4a39; border-radius: 8px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button.on { background: var(--acc); color: #1d1408; border-color: var(--acc); }
  .sep { width: 1px; align-self: stretch; background: var(--line); }
  .lbl { position: fixed; z-index: 1; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; pointer-events: none; }
  .lbl b { color: var(--acc); }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="ui"><h1>Bestiário · antes e depois</h1><span id="esps"></span><span class="sep"></span><span id="clips"></span><span class="sep"></span><button id="bVar">🎲 Variação</button><button id="bBase">Padrão</button></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { ESPECIES, baseCfgEsp, randomCfgEsp, forgeCriatura, springStep, resetSprings, rng } from './forja/erath_criaturas.js';

const ESPS = ['lobo-falcao', 'ursalado', 'besouro-armadura'], LADOS = [{ n: 'Antes', v1: true }, { n: 'Depois', v1: false }], GAP = 60;
const Q = new URLSearchParams(location.search), SHEET = Q.get('sheet');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: !!SHEET });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.setScissorTest(true);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fbfd4');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight('#e2f0ff', '#5a4632', 1.0));
const sois = LADOS.map((_, i) => { const s = new THREE.DirectionalLight('#fff0d8', 2.3); s.castShadow = true; s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -0.0004; s.shadow.normalBias = 0.01; scene.add(s, s.target); return s; });
const chaos = LADOS.map((_, i) => { const g = new THREE.Mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshStandardMaterial({ color: '#6f9a4c', roughness: 1 })); g.rotation.x = -Math.PI / 2; g.position.x = i * GAP; g.receiveShadow = true; scene.add(g); return g; });
const camera = new THREE.PerspectiveCamera(30, 1, 0.02, 200), camV = camera.clone();
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.52;

let esp = Q.get('esp') || ESPS[0], cfg = baseCfgEsp(esp), clip = Q.get('clip') || 'Parado', atores = [];
function construir(keepCam) {
  for (const a of atores) scene.remove(a.P.root);
  atores = LADOS.map((ld, i) => { const P = forgeCriatura(esp, { ...cfg, _v1: ld.v1 }); P.root.position.x = i * GAP; P.root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } }); scene.add(P.root);
    const mixer = new THREE.AnimationMixer(P.root), acts = {}; for (const c of P.clips) acts[c.name] = mixer.clipAction(c); return { P, mixer, acts, ld }; });
  const h = atores[1].P.vista; chaos.forEach(g => g.scale.setScalar(h * 2.2));
  sois.forEach((s, i) => { const k = h * 1.6; Object.assign(s.shadow.camera, { left: -k, right: k, top: k, bottom: -k, near: 0.01, far: k * 8 }); s.shadow.camera.updateProjectionMatrix(); s.position.set(i * GAP + k * 1.1, k * 2.2, k * 1.5); s.target.position.set(i * GAP, 0, 0); });
  montarClips(); tocar(atores[0].acts[clip] ? clip : 'Parado'); if (!keepCam) enquadrar();
}
function enquadrar() { const P = atores[1].P, h = P.vista, voa = ESPECIES[esp].fam === 'A' && ESPECIES[esp].voa; controls.target.set(0, h * (voa ? 0.7 : 0.45), 0); camera.position.set(h * 1.5, h * 0.9, h * 2.6); controls.update(); }
function tocar(n) { clip = n; for (const a of atores) { a.mixer.stopAllAction(); (a.acts[n] || a.acts.Parado).reset().play(); resetSprings(a.P); } marcar(); }
const ui = (id, itens, fn) => { const box = document.getElementById(id); box.textContent = ''; for (const [k, nome] of itens) { const b = document.createElement('button'); b.textContent = nome; b.dataset.k = k; b.onclick = () => fn(k); box.appendChild(b); } };
ui('esps', ESPS.map(k => [k, ESPECIES[k].nome]), k => { esp = k; cfg = baseCfgEsp(k); construir(); });
function montarClips() { ui('clips', atores[1].P.clips.map(c => [c.name, c.name]), k => tocar(k)); }
function marcar() { for (const b of document.querySelectorAll('#esps button')) b.classList.toggle('on', b.dataset.k === esp); for (const b of document.querySelectorAll('#clips button')) b.classList.toggle('on', b.dataset.k === clip); }
document.getElementById('bVar').onclick = () => { cfg = randomCfgEsp(esp, rng(Math.floor(Math.random() * 1e6))); construir(true); };
document.getElementById('bBase').onclick = () => { cfg = baseCfgEsp(esp); construir(true); };
const lbls = LADOS.map(() => { const d = document.createElement('div'); d.className = 'lbl'; document.body.appendChild(d); return d; });
function desenhar() {
  const W = innerWidth, top = SHEET ? 0 : 64, H = innerHeight - top, larga = W / H > 1.1, cols = larga ? 2 : 1, rows = larga ? 1 : 2, w = W / cols, h = H / rows;
  LADOS.forEach((_, i) => { const x = (i % cols) * w, row = Math.floor(i / cols), y = (rows - 1 - row) * h;
    camV.copy(camera); camV.position.x += i * GAP; camV.aspect = w / h; camV.updateProjectionMatrix();
    renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h); renderer.render(scene, camV);
    const a = atores[i]; lbls[i].style.left = (x + 8) + 'px'; lbls[i].style.top = (top + row * h + 8) + 'px'; lbls[i].innerHTML = `<b>${a.ld.n}</b> · ${Math.round(a.P.tris).toLocaleString('pt-BR')} triângulos`; });
}
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
construir();
if (SHEET) { document.getElementById('ui').style.display = 'none'; const t = +(Q.get('t') || 0.3); for (const a of atores) { a.mixer.setTime(t); a.P.root.updateMatrixWorld(true); } renderer.setAnimationLoop(desenhar); }
else { const relogio = new THREE.Clock();
  renderer.setAnimationLoop(() => { const dt = Math.min(0.05, relogio.getDelta()); for (const a of atores) { a.mixer.update(dt); a.P.root.updateMatrixWorld(true); springStep(a.P, dt); } controls.update(); desenhar(); }); }
</script>
</body>
</html>
