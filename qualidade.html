<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de Detalhe</title>
<style>
  :root { --bg: #9fbfd4; --card: rgba(24,20,17,.84); --tx: #f3ead8; --mut: #c9b99c; --acc: #e0aa35; --line: rgba(255,255,255,.14); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--tx); font: 13px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; top: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; z-index: 2; }
  #ui h1 { font-size: 16px; margin: 0 8px 0 0; }
  button { background: #3a2f26; color: var(--tx); border: 1px solid #5d4a39; border-radius: 8px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button.on { background: var(--acc); color: #1d1408; border-color: var(--acc); }
  .sep { width: 1px; align-self: stretch; background: var(--line); }
  .lbl { position: fixed; z-index: 1; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; pointer-events: none; }
  .lbl b { color: var(--acc); }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="ui"><h1>Teste de detalhe</h1><span id="racas"></span><span class="sep"></span><span id="clips"></span><span class="sep"></span><button id="bRosto">Rosto de perto</button><button id="bVar">🎲 Variação</button><button id="bBase">Padrão</button></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RACAS, RACA_ORDEM, baseCfg, randomCfg, forge, springStep, resetSprings, rng } from './forja/erath_forja.js';

const NIVEIS = [{ n: 'Atual · facetado', q: { seg: 1 } }, { n: 'Facetado · 2× segmentos', q: { seg: 2 } }, { n: 'Liso · 2× segmentos', q: { seg: 2, liso: true } }, { n: 'Liso · 3× segmentos', q: { seg: 3, liso: true } }];
const Q = new URLSearchParams(location.search), SHEET = Q.get('sheet'), GAP = 40;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: !!SHEET });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.setScissorTest(true);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fbfd4');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight('#e2f0ff', '#5a4632', 1.0));
const sois = NIVEIS.map((_, i) => { const s = new THREE.DirectionalLight('#fff0d8', 2.3); s.position.set(i * GAP + 2.2, 4.2, 3.0); s.target.position.set(i * GAP, 0.6, 0); s.castShadow = true; s.shadow.mapSize.set(1024, 1024);
  Object.assign(s.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 0.5, far: 12 }); s.shadow.bias = -0.0004; s.shadow.normalBias = 0.01; scene.add(s, s.target); return s; });
for (let i = 0; i < NIVEIS.length; i++) { const g = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.MeshStandardMaterial({ color: '#6f9a4c', roughness: 1 })); g.rotation.x = -Math.PI / 2; g.position.x = i * GAP; g.receiveShadow = true; scene.add(g); }
const camera = new THREE.PerspectiveCamera(30, 1, 0.02, 60), camV = camera.clone();
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.52;

let raca = Q.get('raca') || 'anao', cfg = baseCfg(raca), clip = Q.get('clip') || 'Parado', rosto = Q.get('cam') === 'face', atores = [];
function construir(r, c, keepCam) {
  for (const a of atores) { scene.remove(a.P.root); a.P.geo.dispose(); }
  atores = NIVEIS.map((nv, i) => { const P = forge(r, { ...c, _q: nv.q }); P.root.position.x = i * GAP; P.root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } }); scene.add(P.root);
    const mixer = new THREE.AnimationMixer(P.root), acts = {}; for (const cl of P.clips) acts[cl.name] = mixer.clipAction(cl); return { P, mixer, acts, nv }; });
  tocar(clip); if (!keepCam) enquadrar();
}
function alturas() { const P = atores[0].P, box = new THREE.Box3().setFromObject(P.root); return { h: box.max.y, head: new THREE.Vector3().setFromMatrixPosition(P.B.Head.matrixWorld) }; }
function enquadrar() {
  atores[0].P.root.updateMatrixWorld(true); const { h, head } = alturas();
  if (rosto) { controls.target.set(0, head.y + 0.05, 0); camera.position.set(0.25, head.y + 0.12, 0.85); }
  else { controls.target.set(0, h * 0.5, 0); camera.position.set(h * 1.25, h * 0.85, h * 2.9); }
  controls.update();
}
function tocar(n) { clip = n; for (const a of atores) { a.mixer.stopAllAction(); (a.acts[n] || a.acts.Parado).reset().play(); resetSprings(a.P); } marcar(); }

// ---------- interface
const ui = (id, itens, fn, ativo) => { const box = document.getElementById(id); box.textContent = ''; for (const [k, nome] of itens) { const b = document.createElement('button'); b.textContent = nome; b.dataset.k = k; b.onclick = () => fn(k); box.appendChild(b); } };
ui('racas', RACA_ORDEM.map(k => [k, RACAS[k].nome]), k => { raca = k; cfg = baseCfg(k); construir(raca, cfg); marcar(); });
ui('clips', ['Parado', 'Andar', 'Correr', 'Atacar', 'Comemorar'].map(k => [k, k]), k => tocar(k));
function marcar() { for (const b of document.querySelectorAll('#racas button')) b.classList.toggle('on', b.dataset.k === raca); for (const b of document.querySelectorAll('#clips button')) b.classList.toggle('on', b.dataset.k === clip); document.getElementById('bRosto').classList.toggle('on', rosto); }
document.getElementById('bRosto').onclick = () => { rosto = !rosto; enquadrar(); marcar(); };
document.getElementById('bVar').onclick = () => { cfg = randomCfg(raca, rng(Math.floor(Math.random() * 1e6))); construir(raca, cfg, true); };
document.getElementById('bBase').onclick = () => { cfg = baseCfg(raca); construir(raca, cfg, true); };
const lbls = NIVEIS.map(() => { const d = document.createElement('div'); d.className = 'lbl'; document.body.appendChild(d); return d; });

// ---------- vistas: lado a lado no largo, 2×2 no estreito
function vistas() { const W = innerWidth, H = innerHeight, top = SHEET ? 0 : 64, larga = W / (H - top) > 1.6;
  const cols = larga ? 4 : 2, rows = larga ? 1 : 2, w = W / cols, h = (H - top) / rows;
  return NIVEIS.map((_, i) => ({ x: (i % cols) * w, y: (rows - 1 - Math.floor(i / cols)) * h, w, h, top: top + Math.floor(i / cols) * h })); }
function desenhar() {
  const V = vistas();
  V.forEach((v, i) => { camV.copy(camera); camV.position.x += i * GAP; camV.aspect = v.w / v.h; camV.updateProjectionMatrix();
    renderer.setViewport(v.x, v.y, v.w, v.h); renderer.setScissor(v.x, v.y, v.w, v.h); renderer.render(scene, camV);
    const a = atores[i]; lbls[i].style.left = (v.x + 8) + 'px'; lbls[i].style.top = (v.top + 8) + 'px'; lbls[i].innerHTML = `<b>${a.nv.n}</b> · ${Math.round(a.P.tris).toLocaleString('pt-BR')} triângulos`; });
}
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));

if (SHEET) {   // folha estática para conferir: ?sheet=1&raca=x&clip=Parado&t=0.4&cam=face
  document.getElementById('ui').style.display = 'none';
  construir(raca, cfg); const t = +(Q.get('t') || 0.4);
  for (const a of atores) { a.mixer.setTime(t); a.P.root.updateMatrixWorld(true); }
  enquadrar(); renderer.setAnimationLoop(desenhar); document.title = 'PRONTO';   // no headless o desenho precisa estar no laço
} else {
  construir(raca, cfg); marcar();
  const relogio = new THREE.Clock();
  renderer.setAnimationLoop(() => { const dt = Math.min(0.05, relogio.getDelta()); for (const a of atores) { a.mixer.update(dt); a.P.root.updateMatrixWorld(true); springStep(a.P, dt); } controls.update(); desenhar(); });
}
</script>
</body>
</html>
