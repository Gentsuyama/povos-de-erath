<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bestiário de Erath</title>
<style>
  :root { --bg:#9fbfd4; --card:rgba(24,20,17,.84); --tx:#f3ead8; --mut:#c9b99c; --acc:#e0aa35; --line:rgba(255,255,255,.12); }

  canvas { display:block; }
  #top { position:fixed; left:16px; top:14px; max-width:min(470px, calc(100vw - 32px)); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 14px; }
  #top h1 { margin:0; font-size:19px; } #top .epi { color:var(--acc); font-size:13px; margin-top:1px; }
  #top .sub { color:var(--mut); font-size:12.3px; margin-top:4px; line-height:1.35; }
  select { background:#3a2f26; color:var(--tx); border:1px solid #5d4a39; border-radius:8px; padding:6px 8px; font-size:13px; max-width:100%; }
  #topBtns { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  #panel { position:fixed; right:16px; top:14px; width:320px; max-height:calc(100vh - 28px); overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 13px; font-size:13px; }
  #panel h2 { font-size:11.5px; text-transform:uppercase; letter-spacing:1px; color:var(--acc); margin:12px 0 6px; } #panel h2:first-of-type { margin-top:2px; }
  .row { display:flex; flex-wrap:wrap; gap:5px; }
  button { background:#3a2f26; color:var(--tx); border:1px solid #5d4a39; border-radius:8px; padding:5px 9px; font-size:12.5px; cursor:pointer; }
  button:hover { background:#4a3c30; } button.on { background:var(--acc); color:#1d1408; border-color:var(--acc); font-weight:600; } button.big { font-size:13.5px; padding:7px 12px; }
  .cat { display:grid; grid-template-columns:76px 1fr; gap:4px 8px; align-items:start; margin:5px 0; } .cat > span { color:var(--mut); font-size:12px; padding-top:5px; }
  .cat .row button { padding:3px 7px; font-size:12px; border-radius:6px; }
  label { display:flex; align-items:center; gap:7px; margin:3px 0; cursor:pointer; font-size:12.5px; }
  .stat { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12.3px; } .stat b { color:var(--acc); font-weight:600; text-align:right; }
  #fold { display:none; } .lbl { position:fixed; color:#1d1408; background:rgba(255,255,255,.8); font:12px system-ui; padding:1px 6px; border-radius:4px; pointer-events:none; }
  #hint { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:12.5px; display:none; }
  @media (max-width: 760px) { #top { padding:8px 11px; } #top h1 { font-size:16px; } #top .sub { display:none; }
    #panel { top:auto; bottom:12px; left:16px; right:16px; width:auto; max-height:44vh; } #fold { display:inline-block; float:right; padding:2px 8px; } #panel.min .body { display:none; } #hint { bottom:auto; top:150px; } }
</style>
<script type="importmap">

</script>
</head>
<body>
<div id="top">
  <h1 id="nome">Fada-orvalho</h1>
  <div class="epi" id="epiteto"></div>
  <div class="sub" id="desc"></div>
  <div id="topBtns"><select id="esp"></select><button class="big" id="bSort">🎲 Variação</button><button class="big" id="bBando">Bando (7)</button><button class="big" id="bBase">Padrão</button></div>
</div>
<div id="hint">Clique numa variação para escolher</div>
<div id="panel">
  <button id="fold">▾</button>
  <div class="body">
  <h2>Animação</h2><div class="row" id="clips"></div>
  <h2>Montar</h2><div id="cats"></div>
  <h2>Ver</h2>
  <label><input type="checkbox" id="cAnao"> Ao lado do anão (escala real)</label>
  <label><input type="checkbox" id="cSpring" checked> Molas (antenas, cauda, cabelo, fitas)</label>
  <label><input type="checkbox" id="cSlow"> Câmera lenta (¼)</label>
  <label><input type="checkbox" id="cBones"> Esqueleto</label>
  <label><input type="checkbox" id="cWire"> Arame</label>
  <div class="row" style="margin-top:6px"><button id="bGlb">Baixar GLB</button><button id="bLink">Copiar link</button></div>
  <h2>Ficha</h2><div class="stat" id="stats"></div>
  </div>
</div>

import * as THREE from 'three';

  const fl = []; for (let i = 0; i < 70; i++) { const a = hash1(i + 3) * 6.28, r = 0.4 + 5 * hash1(i + 80); const g = new THREE.ConeGeometry(0.03, 0.12 + 0.1 * hash1(i), 4); g.translate(Math.cos(a) * r, 0.06, Math.sin(a) * r); fl.push(g); }
  const grass = new THREE.Mesh(flatColored(mergeGeometries(fl), (c, f) => c.set('#5f8a3c').multiplyScalar(0.85 + 0.3 * hash1(f))), gm); scene.add(grass);
  const trees = []; for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28, r = 11 + 4 * hash1(i + 60), x = Math.cos(a) * r, z = Math.sin(a) * r;

  const drawStats = () => { if (!D) return; const S = ESPECIES[id];
    const rows = [['Nº na lista', S.num], ['Família de corpo', S.fam === 'A' ? 'A · bípede' + (S.voa ? ' alado' : '') : S.fam === 'C' ? 'C · quadrúpede' + (S.voa ? ' alado' : '') : S.fam === 'D' ? 'D · ' + (ESPECIES[id].receita ? '6/8 patas' : '') + (S.voa ? ' alado' : '') + (D.direcao ? ' · anda de lado' : '') : S.fam === 'F' ? 'F · tentáculos' : S.fam === 'E' ? 'E · serpente/corrente' + (S.voa ? ' voadora' : '') : 'B · flutuante'], ['Tamanho real', S.medida === 'comprimento' ? fmtH(D.comprimento) + ' de comprimento' : fmtH(D.altura)], ['Triângulos', D.tris.toLocaleString('pt-BR')],
      ['Ossos', D.info.ossos], ['Molas', D.info.molas.length ? [...new Set(D.info.molas)].join(', ') : '—'], ['Variações possíveis', combinacoesEsp(id).toLocaleString('pt-BR')],
      ['Velocidade', Object.entries(D.vel).map(([k, v]) => `${k} ${v.toFixed(2)} m/s`).join(' · ') || '—'], ['GLB', glbKB ? glbKB + ' KB' : '…'], ['Espécies prontas', ESP_ORDEM.length + ' de 150']];
    $('stats').innerHTML = rows.map(([a, b]) => `<span>${a}</span><b>${b}</b>`).join(''); };
  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  addEventListener('hashchange', () => { const s = stateFromHash(); if (cfgKeyEsp(s.id, s.cfg) !== cfgKeyEsp(id, D.cfg)) setActor(s.id, s.cfg, true, s.id !== id); });
  const s0 = stateFromHash(); id = null; setActor(s0.id, s0.cfg, true, true); play(Q.get('clip') || 'Parado');
  const clock = new THREE.Clock();
  function frame(force) {
    const real = force ?? Math.min(clock.getDelta(), 1 / 20), dt = real * ($('cSlow').checked ? 0.25 : 1);
    for (const X of bandoOn ? bando : [D]) { X.mixer.update(dt); X.root.updateMatrixWorld(true); if ($('cSpring').checked) springStep(X, dt); }
    if (anao) { anao.mixer.update(dt); }
    controls.update(); renderer.render(scene, camera);
  }
  if (Q.has('sim')) { if (Q.get('bando')) toggleBando(); if (Q.get('anao')) { $('cAnao').checked = true; $('cAnao').onchange(); } for (let i = 0; i < +Q.get('sim'); i++) frame(1 / 60); drawStats(); console.log('SIM ok', D.tris); renderer.setAnimationLoop(() => renderer.render(scene, camera)); }
  else renderer.setAnimationLoop(() => frame());
}
</script>
